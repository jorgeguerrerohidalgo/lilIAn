services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: legal-ai-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./apps/backend:/app
      - document_storage:/app/storage
    env_file:
      - apps/backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
    command: uvicorn app.main:app --host "::" --port 8000

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: legal-ai-frontend
    env_file:
      - apps/frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.worker
    container_name: legal-ai-worker
    env_file:
      - apps/backend/.env
    depends_on:
      - redis
    volumes:
      - ./apps/backend:/app
      - document_storage:/app/storage
    command: python workers/document_processor/doc_worker.py

  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:15-alpine
    container_name: legal-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lilian}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  document_storage:
  postgres_data:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.19.0.0/16
        - subnet: fd00:abcd::/64
