# S6-04: minimal pyproject for the lilIAn backend.
# Centralizes ruff / pytest / coverage config so CI can run the same
# commands as local development.
#
# (The project still uses requirements.txt for runtime deps; this file
# only configures tooling.)

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = [
  "E501",  # line length handled by formatter
  # B008 (function-call-in-default-argument) generates 250+ false positives
  # in async/DB code where the call is harmless (`Field(default=datetime.utcnow)`).
  # The legitimate cases are easier to spot in code review. Sprint 6+.
  "B008",
  # UP045 keeps Optional[X] in legacy annotations - intentional in
  # Pydantic schemas to keep backward compat with the schema export.
  "UP045",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
markers = [
  "unit: pure unit tests (no DB, no network).",
  "integration: integration tests that hit the SQLite test engine.",
  "slow: tests that take >5s and should be skipped by default in CI.",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "migrations/*",
  "tests/*",
  "**/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 60  # Sprint 6 baseline; Sprint 8/9 will push to 80.