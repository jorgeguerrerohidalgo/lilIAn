name: E2E Tests

# S6-B1: End-to-end tests in CI. Runs the Playwright suite against a
# real FastAPI backend + Next.js frontend on every PR to main, every
# push to main, and on-demand via workflow_dispatch.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel duplicate runs on the same branch so a re-push doesn't pile up
# stale e2e jobs.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # SQLite-in-memory keeps the suite dependency-free. If a test ever
    # needs Redis we can add the service below without restructuring.
    env:
      DATABASE_URL: sqlite:///:memory:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      REDIS_URL: redis://localhost:6379/0
      LLM_API_KEY: ci-dummy-llm-key-not-real
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
      # playwright.config.ts skips its own webServer when CI is set, so
      # we boot frontend+backend explicitly in the job below.
      CI: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Backend
      # ---------------------------------------------------------------
      - name: Set up Python (backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start backend (uvicorn)
        working-directory: apps/backend
        run: |
          mkdir -p /tmp/lilian-logs
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/lilian-logs/backend.log 2>&1 &
          echo "backend pid: $!"

      - name: Wait for backend healthcheck
        run: |
          echo "Waiting for backend on http://localhost:8000/health ..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become healthy in 60s"
          echo "--- backend.log ---"
          tail -200 /tmp/lilian-logs/backend.log
          exit 1

      # ---------------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------------
      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Start frontend (next start)
        working-directory: apps/frontend
        env:
          PORT: "3000"
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          mkdir -p /tmp/lilian-logs
          nohup npx next start -p 3000 \
            > /tmp/lilian-logs/frontend.log 2>&1 &
          echo "frontend pid: $!"

      - name: Wait for frontend healthcheck
        run: |
          echo "Waiting for frontend on http://localhost:3000 ..."
          for i in {1..60}; do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "Frontend is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to become healthy in 60s"
          echo "--- frontend.log ---"
          tail -200 /tmp/lilian-logs/frontend.log
          exit 1

      # ---------------------------------------------------------------
      # Playwright
      # ---------------------------------------------------------------
      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-failure
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "--- backend.log (last 200 lines) ---"
          tail -200 /tmp/lilian-logs/backend.log || true

      - name: Dump frontend logs on failure
        if: failure()
        run: |
          echo "--- frontend.log (last 200 lines) ---"
          tail -200 /tmp/lilian-logs/frontend.log || true